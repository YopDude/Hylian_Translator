<head>
 <link href="/example.css" rel="stylesheet" />
</head>
<body>
  <select id="country-select">
  </select>
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
  <script>
  $(document).ready(function() {
    

    function formatOption(option) {
      if (!option.id) {
        return option.text;
      }

      var optionWithImage = $(
        '<span><img src="' + option.id + '" class="img-flag" /> ' + option.text + '</span>'
      );
      return optionWithImage;
    }

    // Add options dynamically
    var options = [
      { id: 'https://upload.wikimedia.org/wikipedia/commons/a/a7/Possible_52-star_U.S._flag.svg', text: 'United States' }, 
      { id: 'https://upload.wikimedia.org/wikipedia/commons/b/b6/Flag_of_Canada.png', text: 'Canada' },
      { id: 'https://upload.wikimedia.org/wikipedia/commons/1/17/Flag_of_Mexico.png', text: 'Mexico' }
    ];
    
    $('#country-select').select2({
      templateResult: formatOption,
      templateSelection: formatOption,
      data: options,
      minimumResultsForSearch: Infinity
    });
  });
  </script>
</body>
